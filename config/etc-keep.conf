# SteamOS 업데이트(A/B 교체) 때 새 쪽으로 옮겨 줄 /etc 파일 목록
# 60-etc-keep 모듈이 /etc/atomic-update.conf.d/steamos-unattended.conf 로 설치한다.
# 형식: 한 줄에 하나, * 는 / 를 제외한 아무 문자, ** 는 / 까지 포함
# 주의: /etc/** 처럼 넓게 잡으면 이후 업데이트의 /etc 변경을 막을 수 있다.

/etc/atomic-update.conf.d/steamos-unattended.conf

