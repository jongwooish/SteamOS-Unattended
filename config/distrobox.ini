# 만들 distrobox 컨테이너 선언 (distrobox assemble 형식)
# 섹션 이름 = 컨테이너 이름. 이미 있는 컨테이너는 건너뛴다.
# 들어가기: distrobox enter devbox

[devbox]
image=docker.io/library/archlinux:latest
additional_packages="git neovim python python-pip base-devel"
pull=true
init=false
start_now=false

[netkit]
image=docker.io/library/debian:stable
additional_packages="nmap iperf3 mtr-tiny tcpdump picocom dnsutils iputils-ping traceroute"
pull=true
init=false
start_now=false
