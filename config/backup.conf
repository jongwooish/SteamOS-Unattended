# 백업 설정 (su-backup 이 읽는다)
# BACKUP_PATHS: $HOME 기준 경로. 없는 경로는 건너뛴다.
BACKUP_DEST="$HOME/Backups"     # SD카드나 NAS 경로로 바꿔도 된다 (예: /run/media/deck/SD/Backups)
BACKUP_KEEP=7                   # 최근 몇 개를 남길지
BACKUP_PATHS=(
    ".config"
    ".bash_aliases"
    ".local/share/applications"
    ".var/app/org.fcitx.Fcitx5/config"
)
